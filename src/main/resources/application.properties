# Nom de l'application
spring.application.name=PFR_Equipe
app.jwt.
server.port=8080


# Configuration de la datasource (SQL Server)
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=PFR;trustServerCertificate=true
spring.datasource.username=Purukogi
spring.datasource.password=PurukogiDB

# Hibernate (Gestion ORM)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect